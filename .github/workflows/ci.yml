name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build, test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Check
        run: ./scripts/check.sh
      - name: Build the application
        run: UNIVERSAL=1 ./scripts/build.sh
      - name: Verify the bundle
        run: |
          codesign --verify --strict --verbose=2 dist/LangSwitch.app
          lipo -archs dist/LangSwitch.app/Contents/MacOS/LangSwitch
          test -d dist/LangSwitch.app/Contents/Resources/LangSwitch_LangSwitchCore.bundle
          test -d dist/LangSwitch.app/Contents/Resources/LangSwitch_LangSwitchLexicon.bundle
